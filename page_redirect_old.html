<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <script>
      /* ============================
         CONFIG
      ============================ */
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxYhYYXvQRMtSstDsL8IBLWUgaD3StF3umW6gZ0baoQCL1HC6VR7TzuQJgQwpUVtJy8pA/exec";
      const SHEET_ID = "14r22rM7oMxfg-OHYMYxxbLaX9AaqckFL2jq7xOxsanM";
      const USER_KEY = "survey_user_id";
      
      /* ============================
         USER + SESSION
      ============================ */
      function getUserId() {
        let id = localStorage.getItem(USER_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(USER_KEY, id);
        }
        return id;
      }
      
      const userId = getUserId();
      const sessionId = crypto.randomUUID();
      const events = [];
      
      /* ============================
         LOG EVENT
      ============================ */
      function logEvent(data) {
        events.push({
          ...data,
          ts: Date.now()
        });
      
        console.log("Logged event:", data);
      }

      /* ============================
         LOG DATA
      ============================ */
      (async function () {
        const params = new URLSearchParams(window.location.search);

        const to = params.get("to");
        if (!to) return;

        const logUrl =
          WEB_APP_URL + "?user_id=" + userId + "&session_id=" + sessionId + 
          params.toString();

        console.log(logUrl);
        

        // Fire-and-forget logging
        try {
          fetch(logUrl, { mode: "no-cors" });
        } catch (e) {
          // Ignore logging errors
        }

        // Immediate, top-level redirect
        // window.location.replace(to);
      })();
    </script>
  </head>
  <body></body>
</html>
