<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logging Data...</title>

    <script>
      /* ============================
         CONFIG
      ============================ */
        const to = "https://fox-view-18925042.figma.site";
        const PROLIFIC_PID = "prolific_pid";
        const PROLIFIC_STUDY_ID = "prolific_study_id";
        const PROLIFIC_SESSION_ID = "prolific_session_id";

      /* ============================
         LOG PROLIFIC DATA
      ============================ */
      (async function () {
        const params = new URLSearchParams(window.location.search);

        const prolific_pid = params.get("PROLIFIC_PID");
        const study_id = params.get("STUDY_ID");
        const session_id = params.get("SESSION_ID");
        

        // Set Prolific PID in local storage
        localStorage.setItem(PROLIFIC_PID, prolific_pid);

        // Set Study ID in local storage
        localStorage.setItem(PROLIFIC_STUDY_ID, study_id);

        // Set Prolific Session ID in local storage
        localStorage.setItem(PROLIFIC_SESSION_ID, session_id);
        
        // Immediate, top-level redirect
        window.location.replace(to);
      })();
    </script>
  </head>
  <body></body>
</html>
