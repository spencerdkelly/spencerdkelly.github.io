<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);

        const to = params.get("to");
        if (!to) return;

        const logUrl =
          "https://script.google.com/macros/s/AKfycbw_MbD-fQe43NSvaRdkd_o41T1Tl-Y7O18KWAMH1YSrKCnKI9SErPUVxl-VqWTU65uueA/exec?" +
          params.toString();

        // Fire-and-forget logging
        try {
          fetch(logUrl, { mode: "no-cors" });
        } catch (e) {
          // Ignore logging errors
        }

        // Immediate, top-level redirect
        window.location.replace(to);
      })();
    </script>
  </head>
  <body></body>
</html>
