<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <script>
      /* ============================
         CONFIG
      ============================ */
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbywZ8UlKflbUBKYMq6PxhacjousmkwDL6DwCkQiyF8VtAiz0oEf00_QPKrLf_vc1K28oA/exec";
      const SHEET_ID = "14r22rM7oMxfg-OHYMYxxbLaX9AaqckFL2jq7xOxsanM";
      const USER_KEY = "survey_user_id";
      const USER_AGE = "survey_user_age";
      const SURVEY = "survey_name";
      
      /* ============================
         USER
      ============================ */
      function getUserId() {
        let id = localStorage.getItem(USER_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(USER_KEY, id);
        }
        return id;
      }

      function getUserAge() {
        let age = localStorage.getItem(USER_AGE);
        if (!age) {
          age = "unknown";
          localStorage.setItem(USER_AGE, age);
        }
        return age;
      }

      function getSurvey() {
        let survey = localStorage.getItem(SURVEY);
        if (!survey) {
          survey = "unknown";
          localStorage.setItem(SURVEY, survey);
        }
        return survey;
      }
      
      const userId = getUserId();
      const userAge = getUserAge();
      const surveyName = getSurvey();
      const events = [];
      
      /* ============================
         LOG EVENT
      ============================ */
      function logEvent(data) {
        events.push({
          ...data,
          ts: Date.now()
        });
      }

      /* ============================
         LOG DATA
      ============================ */
      (async function () {
        const params = new URLSearchParams(window.location.search);

        const to = params.get("to");
        if (!to) return;

        const logUrl =
          WEB_APP_URL + "?user_id=" + userId + "&user_age=" + userAge + "&survey=" + surveyName + "&"
          + params.toString();

        // Fire-and-forget logging
        try {
          fetch(logUrl, { mode: "no-cors" });
        } catch (e) {
          // Ignore logging errors
        }

        // Immediate, top-level redirect
        window.location.replace(to);
      })();
    </script>
  </head>
  <body></body>
</html>
