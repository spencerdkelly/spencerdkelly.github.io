<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Survey Intermediary</title>
</head>
<body>

<script>
/* ============================
   CONFIG
============================ */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxYhYYXvQRMtSstDsL8IBLWUgaD3StF3umW6gZ0baoQCL1HC6VR7TzuQJgQwpUVtJy8pA/exec";
const SHEET_ID = "14r22rM7oMxfg-OHYMYxxbLaX9AaqckFL2jq7xOxsanM";
const USER_KEY = "survey_user_id";

/* ============================
   USER + SESSION
============================ */
function getUserId() {
  let id = localStorage.getItem(USER_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(USER_KEY, id);
  }
  return id;
}

const userId = getUserId();
const sessionId = crypto.randomUUID();
const events = [];

/* ============================
   LOG EVENT
============================ */
function logEvent(data) {
  events.push({
    ...data,
    ts: Date.now()
  });

  console.log("Logged event:", data);
}

/* ============================
   READ FROM URL
============================ */
const params = new URLSearchParams(window.location.search);

const survey = params.get("survey");
const slide = params.get("slide");
const answer = params.get("answer");
const nextLink = params.get("to");

// Log this interaction
if (survey || slide || answer) {
  logEvent({
    survey: survey,
    slide: slide,
    answer: answer
  });
}

/* ============================
   FINAL SUBMIT DETECTION
============================ */
const isFinal = true; //answer === "session_complete";

/* ============================
   SUBMIT (BATCH)
============================ */

function submitSurvey() {
  if (!events.length) return;

  const payload = {
    sheet: survey,
    user_id: userId,
    session_id: sessionId,
    events: JSON.stringify(events)
  };

  const formBody = Object.entries(payload)
    .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v))
    .join("&");

  fetch(WEB_APP_URL, {
    method: "POST",
    body: formBody
  })
  .then(res => res.text())
  .then(console.log)
  .catch(console.error);
}

/* ============================
   FLOW CONTROL
============================ */
if (isFinal) {
  submitSurvey();
}

// Redirect back to Figma (or elsewhere)
if (nextLink) {
  setTimeout(() => {
    // window.location.href = nextLink;
  }, 50);
}
</script>

</body>
</html>
