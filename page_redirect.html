<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <script>
      /* ============================
         CONFIG
      ============================ */
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3NOi0dh2zeFJJsgeFbtlBta7St5n0g9Ig-ST44qZMa3uhJSDngzGoVr72wr1vxAel6w/exec";
      const SHEET_ID = "14r22rM7oMxfg-OHYMYxxbLaX9AaqckFL2jq7xOxsanM";
      const USER_KEY = "survey_user_id";
      const USER_AGE = "survey_user_age";
      const SURVEY_NAME = "survey_name";
      const PROLIFIC_PID = "prolific_pid";
      const PROLIFIC_STUDY_ID = "prolific_study_id";
      const PROLIFIC_SESSION_ID = "prolific_session_id";
      
      /* ============================
         USER
      ============================ */
      function getUserId() {
        let id = localStorage.getItem(USER_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(USER_KEY, id);
        }
        return id;
      }

      function getUserAge() {
        let age = localStorage.getItem(USER_AGE);
        if (!age) {
          age = "unknown";
          localStorage.setItem(USER_AGE, age);
        }
        return age;
      }

      function getSurvey() {
        let survey = localStorage.getItem(SURVEY_NAME);
        if (!survey) {
          survey = "unknown";
          localStorage.setItem(SURVEY_NAME, survey);
        }
        return survey;
      }
      
      // PROLIFIC SURVEY DATA 
      // If a prolific audience member then session data will be present

      function getProlificPid() {
        let pid = localStorage.getItem(PROLIFIC_PID);
        if (!pid) {
          pid = "–";
          //localStorage.setItem(PROLIFIC_PID, pid);
        }
        return pid;
      }

      function getProlificStudyId() {
        let study_id = localStorage.getItem(PROLIFIC_STUDY_ID);
        if (!study_id) {
          study_id = "–";
          //localStorage.setItem(PROLIFIC_STUDY_ID, study_id);
        }
        return study_id;
      }

      function getProlificSessionId() {
        let session_id = localStorage.getItem(PROLIFIC_SESSION_ID);
        if (!session_id) {
          session_id = "–";
          //localStorage.setItem(PROLIFIC_SESSION_ID, session_id);
        }
        return session_id;
      }
      
      const userId = getUserId();
      const userAge = getUserAge();
      const surveyName = getSurvey();
      // Prolific survey data 
      const prolificPID = getProlificPid();
      const prolificStudyID = getProlificStudyId();
      const prolificSessionID = getProlificSessionId();
      const events = [];
      
      /* ============================
         LOG EVENT
      ============================ */
      function logEvent(data) {
        events.push({
          ...data,
          ts: Date.now()
        });
      }

      /* ============================
         LOG DATA / OR END SURVEY
      ============================ */
      (async function () {
        const params = new URLSearchParams(window.location.search);

        const to = params.get("to");
        const end = params.get("end");

        if (!to) return;

        // END OF SURVEY CHECK
        // If the user is from Prolific redirect to the Prolific end screen
        if (end) {
          if (prolificSessionID !== "–") {
            to = to + "/end-prolific";
          } else {
            to = to + "/end";
          }
        } else {
          // log survey data
          const logUrl =
          WEB_APP_URL + 
          "?user_id=" + userId + 
          "&user_age=" + userAge + 
          "&survey=" + surveyName + 
          "&prolific_pid=" + prolificPID + 
          "&prolific_study_id=" + prolificStudyID +
          "&prolific_session_id=" + prolificSessionID +
          "&"
          + params.toString();

          // Fire-and-forget logging
          try {
            fetch(logUrl, { mode: "no-cors" });
          } catch (e) {
            // Ignore logging errors
          }
        }

        // Immediate, top-level redirect
        window.location.replace(to);
      })();
    </script>
  </head>
  <body></body>
</html>
