<body>
<script>
  // -------------------------

  const WEB_APP_URL = "https://script.google.com/a/macros/randstadsourceright.co.uk/s/AKfycbzaYZWuQ5LoF2YNjITz8OHz5LMw_JVjvOUie8O3ByP0CWUKd4xMBX3evnTD8PfhQMkl/exec";
  const SHEET_ID = "1ao4TO8bELOx74VbFa_l3LWM185T90vP2OTaDZZAm_WM";
  
  const params = new URLSearchParams(window.location.search);
  const webAppUrl = params.get('webApp'); // Apps Script URL
  const slideUrl = params.get('slide');   // Current slide URL
  const userId = "XXX";

  // Build async request URL
  const logUrl = webAppUrl + '?' + params.toString();


  const logUrl =
          WEB_APP_URL + 
          "?user_id=" + userId + 
          "&"
          + params.toString();

  // Send click asynchronously
  fetch(logUrl, { method: 'GET', mode: 'no-cors' })
    .catch(e => console.log('Logging failed:', e));

  // Immediately redirect back to the slide
  if (slideUrl) {
    window.location.replace(slideUrl);
  }
</script>
