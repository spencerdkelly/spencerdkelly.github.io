<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Slides Feedback Intermediary</title>
</head>
<body>
<script>
  // -------------------------
  // CONFIG
  // -------------------------
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhyGqnxAJmRzc-Szbni1KW5N3eAeMf74qlxxBpllMinvAkDs0dEyfc6bIPkYSSMOM0/exec";
  const userId = "XXX";
  const to = "https://bbc.com/sport";

  // ---------------------------
  // LOG DATA 
  // ---------------------------
  
  (async function () {
    const params = new URLSearchParams(window.location.search);

    //let to = params.get("to");
    //if (!to) return;

    const logUrl =
    WEB_APP_URL + 
    "?user_id=" + userId + 
    "&"
    + params.toString();

    // Fire-and-forget logging
    try {
      fetch(logUrl, { mode: "no-cors" });
    } catch (e) {
      // Ignore logging errors
    }

    // Close the newly opened browser tab
    console.log('logUrl = ' + logUrl);

    setTimeout(() => {
      window.close();
    }, 300);
    
    
  })();
  
</script>
</body>
</html>
