<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Slides Feedback Intermediary</title>
</head>
<body>
<script>
  // -------------------------
  // CONFIG
  // -------------------------
  const WEB_APP_URL = "https://script.google.com/a/macros/randstadsourceright.co.uk/s/AKfycbzaYZWuQ5LoF2YNjITz8OHz5LMw_JVjvOUie8O3ByP0CWUKd4xMBX3evnTD8PfhQMkl/exec";
  const userId = "XXX";
  const to = "https://bbc.com/sport";

  // ---------------------------
  // LOG DATA / OR END SURVEY
  // ---------------------------
  (async function () {
    const params = new URLSearchParams(window.location.search);

    //let to = params.get("to");
    if (!to) return;

    // log data
      const logUrl =
      WEB_APP_URL + 
      "?user_id=" + userId + 
      "&"
      + params.toString();

      // Fire-and-forget logging
      try {
        fetch(logUrl, { mode: "no-cors" });
      } catch (e) {
        // Ignore logging errors
      }

    // Immediate, top-level redirect
    window.location.replace(to);
  })();
  
</script>
</body>
</html>
