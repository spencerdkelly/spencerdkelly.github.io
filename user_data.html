<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>User Data</title>

    <script>
      /* ============================
         CONFIG
      ============================ */
      const USER_KEY = "survey_user_id";
      const USER_AGE = "survey_user_age";
      
      /* ============================
         USER DATA
      ============================ */

      // ID
      function getUserId() {
        let id = localStorage.getItem(USER_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(USER_KEY, id);
        }
        return id;
      }
    
      const userId = getUserId();

      /* ============================
         LOG USER DATA
      ============================ */
      (async function () {
        const params = new URLSearchParams(window.location.search);

        const age = params.get("user_age");
        const to = params.get("to");
        if (!to) return;

        // Set user age in local storage
        localStorage.setItem(USER_AGE, age);
        
        // Immediate, top-level redirect
        window.location.replace(to);
      })();
    </script>
  </head>
  <body></body>
</html>
